name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the public variant (student screens; admin entry stubbed)
        run: npm run build
        env:
          VITE_PUBLIC: '1'
      - name: Check that no private record reached the build
        run: |
          test -f dist/index.html
          ! grep -E -q 'originalPrompt:"|displayPrompt:"|gho_[A-Za-z0-9]{10}|@gmail\.com' dist/index.html
          ls dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
